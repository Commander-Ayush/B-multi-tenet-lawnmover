spring.application.name=LawnMover_FS

# ── Multi-tenancy ──
# No longer per-process: ONE running instance now serves every business.
# Public routes resolve the tenant per-request from the Origin header
# (Company.domain) — see PublicTenantResolver. Admin routes resolve it
# from the JWT issued at login (CurrentAdmin) — never from anything the
# client sends directly. There is nothing tenant-specific left to
# configure here.

# ── JWT ──
# Required, no default — must be at least 32 characters (HS256 needs a
# >=256-bit key). Set via the JWT_SECRET env var; generate one with e.g.
# `openssl rand -base64 48`.
app.jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds — defaults to 24h if not set.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# NOTE: create-drop wipes and recreates the entire schema on every
# restart — fine for now while there's no real client data, but switch
# to "validate" (with Flyway/Liquibase migrations) before any real
# business's bookings depend on this database surviving a restart.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Lowered from 10 -> 3: with one shared instance now serving multiple
# businesses, 10 connections per-tenant was the math that risked
# exceeding Supabase's connection limit. Small lawn-care booking sites
# have low concurrent traffic; 3 has plenty of headroom. Raise this only
# if you actually see connection-pool exhaustion under real load.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


spring.thymeleaf.check-template-location=false

cloudinary_url=${CLOUDINARY_URL}